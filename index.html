<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NHC Services Process</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f4f0; color: #1a1917; min-height: 100vh; }

  .layout { display: flex; height: 100vh; overflow: hidden; }

  /* ── Diagram panel ── */
  .diagram-panel { flex: 0 0 460px; overflow-y: auto; padding: 20px 16px; background: #faf9f7; border-right: 1px solid #e2e0da; }
  .diagram-panel h1 { font-size: 13px; font-weight: 600; color: #444441; margin-bottom: 14px; letter-spacing: .02em; text-transform: uppercase; }

  /* Legend */
  .legend { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .leg { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #5f5e5a; }
  .leg-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

  /* Shared nodes */
  .node { cursor: pointer; transition: filter .15s; }
  .node:hover { filter: brightness(.94); }
  .node.active rect, .node.active polygon { stroke-width: 2 !important; }

  /* Flow lines */
  .flow-line { pointer-events: none; }

  /* ── Detail panel ── */
  .detail-panel { flex: 1; overflow-y: auto; padding: 28px 28px; }
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #888780; gap: 10px; }
  .empty-state svg { opacity: .3; }
  .empty-state p { font-size: 13px; }

  .detail-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #e2e0da; }
  .detail-num { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
  .detail-title-wrap { flex: 1; }
  .detail-title { font-size: 17px; font-weight: 600; color: #1a1917; line-height: 1.3; }
  .detail-actor { font-size: 12px; margin-top: 4px; font-weight: 500; }
  .detail-path-badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 500; margin-left: 8px; }

  .detail-section { margin-bottom: 20px; }
  .detail-section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: #888780; margin-bottom: 10px; }

  .req-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .req-list li { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: #3a3937; line-height: 1.5; padding: 8px 10px; background: #f5f4f0; border-radius: 6px; border: 1px solid #e2e0da; }
  .req-list li .bullet { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
  .req-list li.warn { background: #fef9ec; border-color: #f0d070; color: #7a5c00; }
  .req-list li.info { background: #eef5fb; border-color: #b8d4ef; color: #0c447c; }
  .req-list li.danger { background: #fdeeed; border-color: #f0b8b5; color: #8b1a17; }
  .req-list li.optional { background: #f0effe; border-color: #ccc9f5; color: #3c3489; opacity: .85; }

  .outcome-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .outcome-card { padding: 10px 12px; border-radius: 6px; border: 1px solid; font-size: 12px; line-height: 1.5; }
  .outcome-card strong { display: block; font-size: 12px; font-weight: 600; margin-bottom: 2px; }

  .note-box { padding: 12px 14px; border-radius: 8px; font-size: 13px; line-height: 1.6; border: 1px solid; margin-bottom: 16px; }

  @media (max-width: 700px) {
    .layout { flex-direction: column; height: auto; }
    .diagram-panel { flex: none; border-right: none; border-bottom: 1px solid #e2e0da; overflow-x: auto; }
    .detail-panel { padding: 20px 16px; }
    .outcome-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="layout">

      <line class="flow-line" x1="330" y1="610" x2="220" y2="610" stroke="#aaa" stroke-width="1"/>

  <!-- ── DETAIL PANEL ── -->

      <p>Click any step to see requirements</p>
    </div>
    <div id="detail-content" style="display:none"></div>
  </div>

</div>

<script>
const STEPS = {
  s1: {
    num: '1', title: 'Sales intake', path: 'Shared', pathColor: '#185FA5', pathBg: '#E6F1FB',
    actor: 'Sales', actorColor: '#0C447C',
    note: { type: 'warn', text: 'Sales may only discuss Meter at a high level. No direct vendor contact, pricing promises, or deal registration until SE is engaged.' },
    sections: [
      { label: 'Required fields', items: [
        { text: 'Customer name and primary contact' },
        { text: 'Customer contact email and phone' },
        { text: 'Sales rep name' },
        { text: 'Product / service being scoped (Meter, VeloCloud, BigLeaf, Fortinet, Netskope, UniFi)' },
        { text: 'Opportunity stage (Prospecting / Discovery / Qualified / Proposal / Negotiation)' },

        { text: 'Site addresses' },
        { text: 'Approximate square footage per location' },
        { text: 'Current vendor environment (firewall, switch, Wi-Fi)' },

        { text: 'Competitive situation' },

    note: { type: 'info', text: 'SE determines fit before any vendor engagement or pricing work begins. If not a fit, sales is notified and the opportunity is closed.' },

      { label: 'Qualification criteria', items: [
        { text: 'Multi-site or growing customer' },
        { text: 'Needs managed networking, security, SD-WAN, or SASE' },
        { text: 'Hardware refresh or contract renewal upcoming' },
        { text: 'Weak internal IT / networking support' },
        { text: 'Customer open to OpEx / NaaS / managed service model' },

      { label: 'Product-specific signals', items: [

        { text: 'Not eligible → notify sales, opportunity closed', type: 'danger' },

  },

    num: '3a', title: 'Register on Meter portal', path: 'Meter path', pathColor: '#185FA5', pathBg: '#E6F1FB',

    note: { type: 'warn', text: 'Only SE, product, or the designated channel owner may submit the deal registration. Sales must not access the Meter partner portal.' },
    sections: [
      { label: 'Required for registration', items: [
        { text: 'Customer legal name' },
        { text: 'Customer website' },
        { text: 'Headquarters address' },
        { text: 'Locations in scope' },
        { text: 'Estimated number of users' },
        { text: 'Estimated close date' },
        { text: 'Opportunity description' },
        { text: 'NHC sales owner name' },
        { text: 'NHC SE owner name' },
        { text: 'Requested reseller pricing path' },
      ]},
      { label: 'Where to submit', items: [
        { text: 'Meter partner portal — SE submits directly', type: 'info' },
      ]}
    ]
  },
  m3b: {

    actor: 'Meter', actorColor: '#3C3489',

    sections: [
      { label: 'Discovery checklist', items: [

        { text: 'MDF / IDF locations and cabling status' },

function show(id) {
  const step = STEPS[id];
  if (!step) return;

  // Highlight active node
  document.querySelectorAll('.node').forEach(n => n.classList.remove('active'));
  const el = document.getElementById('n-' + id);
  if (el) el.classList.add('active');

  document.getElementById('empty-state').style.display = 'none';
  const content = document.getElementById('detail-content');
  content.style.display = 'block';

  let noteHtml = '';
  if (step.note) {
    const colors = {
      warn: { bg: '#fef9ec', border: '#f0d070', color: '#7a5c00' },
      info: { bg: '#eef5fb', border: '#b8d4ef', color: '#0c447c' },
      danger: { bg: '#fdeeed', border: '#f0b8b5', color: '#8b1a17' }
    }[step.note.type] || {};
    noteHtml = `<div class="note-box" style="background:${colors.bg};border-color:${colors.border};color:${colors.color}">${step.note.text}</div>`;
  }

  let sectionsHtml = step.sections.map(sec => {
    const items = sec.items.map(item => {
      const cls = item.type ? ` ${item.type}` : '';
      const bulletColor = { warn: '#c8a000', info: '#185FA5', danger: '#c0302c', optional: '#534AB7' }[item.type] || '#888780';
      return `<li class="${cls}"><span class="bullet" style="background:${bulletColor}"></span>${item.text}</li>`;
    }).join('');
    return `<div class="detail-section"><div class="detail-section-label">${sec.label}</div><ul class="req-list">${items}</ul></div>`;
  }).join('');

  content.innerHTML = `
    <div class="detail-header">
      <div class="detail-num" style="background:${step.pathBg};color:${step.actorColor}">${step.num}</div>
      <div class="detail-title-wrap">
        <div class="detail-title">${step.title}</div>
        <div class="detail-actor" style="color:${step.actorColor}">${step.actor}
          <span class="detail-path-badge" style="background:${step.pathBg};color:${step.pathColor}">${step.path}</span>
        </div>
      </div>
    </div>
    ${noteHtml}
    ${sectionsHtml}
  `;
}
