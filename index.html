<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NHC Solution Playbook</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f4f0; color: #1a1917; min-height: 100vh; }
  .layout { display: flex; height: 100vh; overflow: hidden; }

  .diagram-panel { flex: 0 0 480px; overflow-y: auto; padding: 20px 16px; background: #faf9f7; border-right: 1px solid #e2e0da; }
  .diagram-panel h1 { font-size: 13px; font-weight: 600; color: #444441; margin-bottom: 4px; letter-spacing: .04em; text-transform: uppercase; }
  .diagram-panel p.sub { font-size: 11px; color: #888780; margin-bottom: 14px; }

  .legend { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .leg { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #5f5e5a; }
  .leg-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

  .node { cursor: pointer; }
  .node:hover rect, .node:hover polygon { opacity: .88; }
  .node.active > rect { stroke-width: 2.5 !important; }

  .detail-panel { flex: 1; overflow-y: auto; padding: 28px; }
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #aaa; gap: 10px; }
  .empty-state p { font-size: 13px; }

  .detail-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #e2e0da; }
  .detail-num { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .detail-title { font-size: 18px; font-weight: 600; color: #1a1917; line-height: 1.3; }
  .detail-meta { display: flex; align-items: center; gap: 8px; margin-top: 5px; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 2px 9px; border-radius: 20px; font-weight: 500; }

  .note-box { padding: 11px 14px; border-radius: 8px; font-size: 13px; line-height: 1.6; border: 1px solid; margin-bottom: 18px; }

  /* Approval flow — vertical cards */
  .approval-flow { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
  .approval-card { display: flex; gap: 14px; align-items: flex-start; padding: 12px 14px; border-radius: 8px; border: 1px solid #e2e0da; background: #faf9f7; }
  .approval-card.highlight { background: #FFF4E6; border-color: #f0b860; }
  .approval-card .ap-badge { min-width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; background: #e2e0da; color: #5f5e5a; }
  .approval-card.highlight .ap-badge { background: #C87000; color: white; }
  .approval-card .ap-body {}
  .approval-card .ap-title { font-size: 13px; font-weight: 600; color: #1a1917; margin-bottom: 3px; }
  .approval-card .ap-desc { font-size: 12px; color: #5f5e5a; line-height: 1.5; }
  .approval-arrow { text-align: center; font-size: 14px; color: #aaa; margin: -2px 0; }

  .detail-section { margin-bottom: 20px; }
  .section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: #888780; margin-bottom: 9px; }
  .req-list { list-style: none; display: flex; flex-direction: column; gap: 5px; }
  .req-list li { display: flex; gap: 9px; align-items: flex-start; font-size: 13px; color: #3a3937; line-height: 1.5; padding: 8px 10px; background: #f5f4f0; border-radius: 6px; border: 1px solid #e2e0da; }
  .req-list li .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; background: #aaa; }
  .req-list li.warn { background: #fef9ec; border-color: #f0d070; color: #7a5c00; }
  .req-list li.warn .dot { background: #c8a000; }
  .req-list li.info { background: #eef5fb; border-color: #b8d4ef; color: #0c447c; }
  .req-list li.info .dot { background: #185FA5; }
  .req-list li.danger { background: #fdeeed; border-color: #f0b8b5; color: #8b1a17; }
  .req-list li.danger .dot { background: #c0302c; }
  .req-list li.optional { background: #f0effe; border-color: #ccc9f5; color: #3c3489; }
  .req-list li.optional .dot { background: #534AB7; }
  .req-list li.success { background: #e8f7f2; border-color: #8fd4b8; color: #085041; }
  .req-list li.success .dot { background: #0F6E56; }

  @media (max-width: 760px) {
    .layout { flex-direction: column; height: auto; }
    .diagram-panel { flex: none; border-right: none; border-bottom: 1px solid #e2e0da; }
    .detail-panel { padding: 20px 16px; }
  }
</style>
</head>

<script>
const APPROVAL_FLOW_METER = [

  m3a: {
    num:'3a', title:'Register on Meter portal', path:'Meter path', pathBg:'#E6F1FB', pathColor:'#185FA5',
    actor:'SE only', actorColor:'#0C447C',
    note:{ type:'warn', text:'Only SE, product, or the designated channel owner may submit. Sales must not access the Meter partner portal.' },
    sections:[

        {text:'Customer legal name'},

function show(id) {
  const step = STEPS[id];
  if (!step) return;

  document.querySelectorAll('.node').forEach(n => n.classList.remove('active'));
  const el = document.getElementById('n-' + id);
  if (el) el.classList.add('active');

  document.getElementById('empty-state').style.display = 'none';
  const content = document.getElementById('detail-content');
  content.style.display = 'block';

  const nc = { warn:{bg:'#fef9ec',border:'#f0d070',color:'#7a5c00'}, info:{bg:'#eef5fb',border:'#b8d4ef',color:'#0c447c'}, danger:{bg:'#fdeeed',border:'#f0b8b5',color:'#8b1a17'}, optional:{bg:'#f0effe',border:'#ccc9f5',color:'#3c3489'} }[step.note?.type] || {bg:'#eef5fb',border:'#b8d4ef',color:'#0c447c'};
  const noteHtml = step.note ? `<div class="note-box" style="background:${nc.bg};border-color:${nc.border};color:${nc.color}">${step.note.text}</div>` : '';

  const approvalHtml = step.approvalFlow ? `
    <div class="detail-section">
      <div class="section-label">Approval sequence</div>
      <div class="approval-flow">
        ${step.approvalFlow.map((a, i) => `
          ${i > 0 ? '<div class="approval-arrow">↓</div>' : ''}
          <div class="approval-card ${a.highlight ? 'highlight' : ''}">
            <div class="ap-badge">${a.num}</div>
            <div class="ap-body">
              <div class="ap-title">${a.title}</div>
              <div class="ap-desc">${a.desc}</div>
            </div>
          </div>`).join('')}
      </div>
    </div>` : '';

  const dc = { warn:'#c8a000', info:'#185FA5', danger:'#c0302c', optional:'#534AB7', success:'#0F6E56' };
  const sectionsHtml = step.sections.map(sec => {
    const items = sec.items.map(item => {
      const cls = item.type ? ` ${item.type}` : '';
      return `<li class="${cls}"><span class="dot" style="background:${dc[item.type]||'#aaa'}"></span>${item.text}</li>`;
    }).join('');
    return `<div class="detail-section"><div class="section-label">${sec.label}</div><ul class="req-list">${items}</ul></div>`;
  }).join('');

  content.innerHTML = `
    <div class="detail-header">
      <div class="detail-num" style="background:${step.pathBg};color:${step.actorColor}">${step.num}</div>
      <div>
        <div class="detail-title">${step.title}</div>
        <div class="detail-meta">
          <span style="font-size:12px;font-weight:500;color:${step.actorColor}">${step.actor}</span>
          <span class="badge" style="background:${step.pathBg};color:${step.pathColor}">${step.path}</span>
        </div>
      </div>
    </div>
    ${noteHtml}${approvalHtml}${sectionsHtml}
  `;
}
